name: CI

# One workflow checks and deploys, so the deployment can wait for the checks of the same commit:
# push to main -> verify + integration + e2e -> deploy (only if all succeeded). Pull requests only run the
# checks. A manual run (workflow_dispatch) on main redeploys after the same checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels the older run. Runs on main are never cancelled, so a
# deployment that is already in progress is not interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
      # The site reads its products from the production API. The address is the repository
      # variable API_URL (Settings > Secrets and variables > Actions > Variables), not a secret.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - run: npm run build:server
      # On main only: keep the production build as the Pages artifact. It is published by the
      # `deploy` job below, and only if `e2e` passes as well.
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # The tests of the code that talks to MongoDB (queries, unique indexes, sorting, the index that
  # expires sessions) need a real server. `npm run test:server` skips them so that it stays fast and
  # needs nothing; this job runs them, and `npm run test:integration` refuses to start without a
  # MongoDB, so they can never "pass" by being skipped. The database is a throwaway server that
  # exists only for this job (a service container, which is how GitHub runs one: Docker is not a
  # dependency of the project). Nothing here can reach the production database: its address is not
  # a secret of this workflow, and the tests only use databases named online_store_test_<random>.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the MongoDB integration tests
        run: npm run test:integration

  # Browser tests of the production build, served like GitHub Pages serves it. Runs in parallel
  # with `verify`. `npm run test:e2e` builds the site first (see playwright.config.ts), so the
  # tests never run against a stale build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: npm run test:e2e
      # Only when something failed: the HTML report plus screenshots and traces of the failing
      # tests. These are build artifacts (git-ignored), never committed.
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Publishes the site that `verify` built, for the same commit. `needs` means this job runs
  # only if all the jobs above succeeded: if either fails or is cancelled, it is skipped.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, e2e, integration]
    runs-on: ubuntu-latest
    # Up to 5 minutes of this can be spent waiting for a sleeping API host to wake up.
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Never publish a site whose products cannot be loaded: check the production API first
      # (up, connected to its database, products readable, CORS allowing this site). It waits for a
      # host that is asleep. Skipped while API_URL is not set, so the site is deployed as before.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.API_URL != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: vars.API_URL != ''
        with:
          node-version-file: .nvmrc
      - name: Check the production API
        if: vars.API_URL != ''
        # The site's origin is its GitHub Pages host, <owner>.github.io, which a browser sends in
        # lower case.
        run: |
          export SITE_ORIGIN="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          node scripts/check-api.mjs
        env:
          API_URL: ${{ vars.API_URL }}
          OWNER: ${{ github.repository_owner }}

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
