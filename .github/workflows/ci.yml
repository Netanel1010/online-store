name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Browser tests of the production build, served like GitHub Pages serves it. Runs in parallel
  # with `verify`. `npm run test:e2e` builds the site first (see playwright.config.ts), so the
  # tests never run against a stale build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: npm run test:e2e
      # Only when something failed: the HTML report plus screenshots and traces of the failing
      # tests. These are build artifacts (git-ignored), never committed.
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
