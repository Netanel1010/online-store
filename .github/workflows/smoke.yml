name: Smoke

# A check of production that nobody has to remember to run: every night, and on demand, the deployed
# API and the deployed site are checked from the outside, so a problem that appears while nothing is
# being deployed (Atlas, Render, GitHub Pages, an expired setting) is noticed by the next morning
# instead of by a visitor. It is read-only: it creates no account and no data.
#
# It is not part of the deployment gate (`ci.yml`), and a failure here changes nothing that is live:
# GitHub notifies the people who watch the repository when a scheduled run fails. GitHub also turns
# scheduled workflows off after 60 days without any activity in the repository; run it by hand
# (Actions > Smoke > Run workflow) to turn it on again.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  production:
    # The same repository variable as the deploy job: without it there is no production to check.
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    # Up to 5 minutes of this can be spent waiting for a sleeping API host to wake up.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The scripts read the products through the shared Zod schema (src/features/products/schema.ts),
      # which imports zod. Only what is shipped, and no install scripts: nothing here builds or tests.
      - name: Install the dependencies of the checks
        run: npm ci --omit=dev --ignore-scripts
      - name: Check the production API
        # Strict: production already runs the version that has the headers, and the seed has been run,
        # so a missing header or a catalog that differs from products.json is a real finding.
        run: |
          export SITE_ORIGIN="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          node scripts/check-api.mjs
        env:
          API_URL: ${{ vars.API_URL }}
          OWNER: ${{ github.repository_owner }}
          STRICT_HARDENING: '1'
      - name: Check the production site
        run: |
          REPOSITORY="${GITHUB_REPOSITORY#*/}"
          export SITE_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/${REPOSITORY}/"
          node scripts/check-site.mjs
        env:
          OWNER: ${{ github.repository_owner }}
